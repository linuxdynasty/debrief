name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ShellCheck
        run: |
          shellcheck -S warning install.sh scripts/debrief.sh scripts/run-tests.sh \
            hooks/*.sh hooks/lib/*.sh hooks/agy/*.sh hooks/codex/*.sh hooks/muse/*.sh \
            scripts/tests/*.sh
      - name: Run full test suite
        run: npm test
      - name: Verify packed npm tarball contents and CLI smoke test
        run: |
          set -euo pipefail
          pub_warn="$(npm publish --dry-run 2>&1 || true)"
          if grep -q "npm warn publish" <<<"${pub_warn}"; then
            echo "npm publish --dry-run emitted warnings (run npm pkg fix):" >&2
            printf '%s\n' "${pub_warn}" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          tgz="$(npm pack --pack-destination "${tmp}" | tail -n 1)"
          tar -xzf "${tmp}/${tgz}" -C "${tmp}"
          pkg="${tmp}/package"
          node -e 'const p = require(process.argv[1]); if (!p.bin || p.bin.debrief !== "bin/debrief.mjs") { console.error("missing bin.debrief in packed package.json:", p.bin); process.exit(1); }' "${pkg}/package.json"
          required=(
            ".claude-plugin/marketplace.json"
            ".claude-plugin/plugin.json"
            "bin/debrief.mjs"
            "lib/installer.mjs"
            "scripts/debrief.sh"
            "scripts/lib/debrief_pipeline.py"
            "scripts/lib/debrief_render.py"
            "skills/debrief/SKILL.md"
            "hooks/hooks.json"
            "hooks/lib/telemetry-events.sh"
            "hooks/skill-loaded.sh"
            "hooks/stop-failure.sh"
            "hooks/codex/skill-loaded.sh"
            "hooks/agy/skill-loaded.sh"
            "hooks/muse/hooks.json"
            "hooks/opencode/debrief-telemetry.js"
            "install.sh"
          )
          for f in "${required[@]}"; do
            test -f "${pkg}/${f}" || { echo "missing required file in npm tarball: ${f}" >&2; exit 1; }
          done
          HOME="${tmp}/home" XDG_DATA_HOME="${tmp}/xdg-data" XDG_CONFIG_HOME="${tmp}/xdg-config" \
            node "${pkg}/bin/debrief.mjs" install --all --with-hooks --copy
          HOME="${tmp}/home" XDG_DATA_HOME="${tmp}/xdg-data" XDG_CONFIG_HOME="${tmp}/xdg-config" \
            node "${pkg}/bin/debrief.mjs" doctor
          HOME="${tmp}/home" XDG_DATA_HOME="${tmp}/xdg-data" XDG_CONFIG_HOME="${tmp}/xdg-config" \
            node "${pkg}/bin/debrief.mjs" --version
